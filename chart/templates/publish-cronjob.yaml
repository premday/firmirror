apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "firmirror.onDemandCronJobName" (dict "root" . "operation" "publish") }}
  labels:
    {{- include "firmirror.labels" . | nindent 4 }}
    firmirror.premday.io/operation: publish
spec:
  # Republishes every ring feed from its snapshot, without promoting anything.
  # The refresh does this at the end of each nightly run, so this CronJob is
  # only there to apply a blocklist change straight away rather than waiting
  # for the night: run it the same way as a promotion, with
  # `kubectl create job --from=cronjob/<name>`.
  suspend: true
  schedule: "0 0 31 2 *" # 31st of February: never a real date
  successfulJobsHistoryLimit: {{ .Values.cronjob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronjob.failedJobsHistoryLimit }}
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        {{- include "firmirror.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "firmirror.jobSpec" (dict "root" . "args" (include "firmirror.publishArgs" .)) | nindent 6 }}
