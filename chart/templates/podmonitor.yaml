{{- /* Needs the Prometheus Operator CRDs. */ -}}
{{- $podMonitor := ((.Values.daemon | default dict).metrics | default dict).podMonitor | default dict }}
{{- if and (include "firmirror.daemonEnabled" .) $podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "firmirror.fullname" . }}
  labels:
    {{- include "firmirror.labels" . | nindent 4 }}
    {{- with $podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "firmirror.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: daemon
  podMetricsEndpoints:
  - port: metrics
    path: /metrics
    {{- with $podMonitor.interval }}
    interval: {{ . }}
    {{- end }}
{{- end }}
