# CronJob schedule (runs daily at 2 AM by default)
schedule: "0 2 * * *"

# Container image configuration
image:
  repository: ghcr.io/premday/firmirror
  pullPolicy: IfNotPresent
  tag: ""  # Defaults to the chart appVersion

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

vendors:
  # Dell firmware configuration
  dell:
    enabled: false
    # Comma-separated list of Dell machine System IDs (4-character codes)
    # Example: "0C60,0C61,0A2C"
    machinesId: ""
    # A copy of https://dl.dell.com to read the catalog and the firmware from,
    # such as an internal mirror. An HTTP(S) URL, a file:// URL, or a plain
    # directory: a mirror kept in a volume is read where it sits.
    # Example: "https://mirror.example.com/dell"
    baseUrl: ""

  # HPE firmware configuration
  hpe:
    enabled: false
    # Comma-separated list of HPE generations
    # Valid values: gen10, gen11, gen12
    # Example: "gen10,gen11"
    gens: ""
    # A copy of https://downloads.linux.hpe.com/SDR/repo to read the firmware
    # from, such as an internal mirror. An HTTP(S) URL, a file:// URL, or a
    # plain directory holding the fwpp-<gen> repositories.
    # Example: "https://mirror.example.com/SDR/repo"
    baseUrl: ""

storage:
  # Output directory inside the container
  outputDir: /data/firmirror
  s3:
    enabled: false
    # Replace rebuilt metadata releases and delete unreferenced CAB packages
    cleanup: false
    bucket: ""
    prefix: ""
    region: ""
    endpoint: ""
    # secret with AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY keys
    secretName: ""

# Rollout rings, published as fwupd BKC tags. What each ring serves is a YAML file
# edited by `firmirror bkc promote` and read by the refresh. Hosts join a ring
# with HostBkc=<tag prefix>-<ring> in fwupd.conf and run `fwupdmgr sync`.
bkc:
  # Where the refresh reads the file from, an HTTP(S) URL. Empty publishes no ring
  # tag. A refresh fails, and is retried, when it cannot read the file.
  url: ""  # e.g. https://example.com/firmirror_bkc
  # Allow a plain HTTP URL, whose content can be altered on the way. For a trusted
  # network only.
  allowHttp: false
  regen:
    # Extra arguments of the regen-metadata Job, such as --force to drop the ring
    # tags from the stored metadata on purpose, --drop-base-url or --stop-signing.
    extraArgs: []
    # How long a finished regen-metadata Job is kept, as its logs record what was
    # published. 0 deletes it as soon as it finishes (for the refresh, 0 sets no TTL).
    ttlSecondsAfterFinished: 604800  # 7 days
    # How many finished Jobs the CronJob keeps, successful and failed each. It
    # removes older ones, including those started by hand, whatever their TTL.
    historyLimit: 10

signing:
  enabled: false
  secretName: ""
  certKey: ""
  pkeyKey: ""

# Extra arguments of the refresh, such as --force to publish with no ring tag over
# metadata that has some, --drop-base-url or --stop-signing.
extraArgs: []

# Public URL the output is served from, as the fwupd remote's FirmwareBaseURI.
# The metadata then names packages by absolute URL, not bare file name. Used by
# the refresh and the regen-metadata Job.
# Example: "https://mirror.example.com/fwupd/"
firmwareBaseUrl: ""

externalSecret:
  create: false
  secretStoreRef: ""
  targetSecret: ""
  data: []
  # - secretKey: AWS_ACCESS_KEY_ID
  #   remoteRef:
  #     key: "/secret/aws-creds"
  #     property: AWS_ACCESS_KEY_ID

# Persistent storage configuration
persistence:
  enabled: false
  existingClaim: ""  # Use an existing PVC
  storageClass: ""  # Use default storage class
  accessMode: ReadWriteOnce
  size: 50Gi

# Service account configuration
serviceAccount:
  create: false
  annotations: {}
  name: ""

# Pod-level security context
podSecurityContext:
  fsGroup: 1000
  runAsUser: 1000
  runAsNonRoot: true

# Container-level security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false  # fwupdtool may need write access to temp dirs
  runAsNonRoot: true
  runAsUser: 1000

# Resource limits and requests
resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

# CronJob specific settings
cronjob:
  # Number of successful/failed jobs to keep in history
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # Restart policy for the job pods
  restartPolicy: OnFailure
  # Job backoff limit
  backoffLimit: 2
  # Active deadline in seconds (max runtime)
  activeDeadlineSeconds: 7200  # 2 hours
  # Time to live after finished
  ttlSecondsAfterFinished: 86400  # 24 hours
  # Grace period on termination. On activeDeadlineSeconds expiry the pod gets
  # SIGTERM, which cancels the context and lets the deferred SaveMetadata
  # persist the run's progress; 30s (the Kubernetes default) is not enough to
  # compress, sign and upload metadata.xml.zst.
  terminationGracePeriodSeconds: 600  # 10 minutes
